# El broker MQTT del monitoreo, en la máquina de cada uno.
#
# Mosquitto y no EMQX ni HiveMQ: es un broker MQTT puro, sin webhooks ni motor
# de reglas, y eso es justamente lo que obliga a que exista el proceso puente
# (ver scripts/puente.ts). La decisión está escrita en PRODUCT.md; acá sólo se
# la configura.
#
# Este archivo se copia adentro del contenedor al arrancar, así que cambiarlo
# pide un `docker compose restart mosquitto`. El de al lado —`acl`— dice quién
# puede publicar y escuchar qué, y viaja igual; el de contraseñas NO está en el
# repositorio, vive en un volumen y se administra con `npm run mqtt:credencial`.

# Sin un `listener` explícito, Mosquitto 2 escucha únicamente en el 127.0.0.1
# de adentro del contenedor y ninguna conexión de afuera llega nunca. Es el
# cambio de la versión 2 que más tiempo hace perder.
listener 1883

# Nadie entra sin credencial, ni siquiera en desarrollo.
#
# Un broker anónimo en la notebook es un broker anónimo el día que alguien lo
# copie a un servidor, y ese día cualquiera publica lecturas en nombre de
# cualquier buque. Además haría imposible probar acá lo único que el broker
# aporta al aislamiento: que un equipo no pueda hablar por otro.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Lo que se publicó mientras el puente estaba caído.
#
# El puente se conecta con sesión persistente y QoS 1, así que el broker le
# guarda los mensajes que llegaron mientras no estaba y se los entrega al
# volver. Sin `persistence`, esa cola vive en memoria y se pierde entera cuando
# se reinicia el contenedor — que es justo el momento en que hace falta.
persistence true
persistence_location /mosquitto/data/

# Cuántos mensajes le guarda a un suscriptor ausente antes de empezar a tirar.
#
# Y se encola sólo lo que el equipo haya publicado con **QoS 1**: un QoS 0 no se
# guarda para nadie que no esté escuchando en ese momento, así está el protocolo
# y no hay configuración que lo cambie. El firmware que publique con QoS 0 pierde
# todo lo que mida mientras el puente esté caído, en silencio.
#
# El techo existe igual: sin límite, un puente caído un fin de semana llena la
# memoria del broker. Diez mil son unas tres horas de un parque chico
# reportando cada segundo. Cuánto se guarda y por cuánto tiempo es una decisión
# de producto que PRODUCT.md dejó abierta a propósito; esto es sólo el número
# con el que se trabaja en local, y está acá para que se lo pueda mirar.
max_queued_messages 10000

# El registro va a la salida estándar, que es donde `docker compose logs` mira.
#
# Y no se nombra ningún `log_type`, a propósito: nombrar uno solo reemplaza el
# juego entero que trae por omisión —error, warning, notice, information— y lo
# primero que se pierde es «Opening ipv4 listen socket on port 1883», que es la
# única línea que contesta si el broker realmente quedó escuchando.
log_dest stdout

# Quién se conectó y quién se cayó. En un producto donde quedarse sin señal es
# un estado normal y previsto, esas dos líneas son la mitad del diagnóstico.
connection_messages true
