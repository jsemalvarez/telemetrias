# La base de datos de desarrollo, en la máquina de cada uno.
#
# Postgres 17 porque es lo que corre Supabase, que es la base de stage y de
# producción (17.6.1, motor 17, canal GA — verificado el 2026-09-05). Trabajar
# en local sobre otro mayor es descubrir en el deploy que una migración usaba
# algo que allá no existe.
#
# Los puertos se publican desplazados y salen de .env.local: esta máquina ya
# tiene otros Postgres ocupando 5432 y 5433, y un Adminer en 8080. Adentro de
# la red de Docker el puerto sigue siendo el 5432 de siempre.
#
#   docker compose up -d      levanta base y visor
#   docker compose down       los baja, conservando los datos
#   docker compose down -v    los baja y BORRA los datos

# El nombre del proyecto de Compose. Sin esto lo toma del nombre de la carpeta,
# que acá no dice nada: los volúmenes y la red quedan con un prefijo que no es
# el del sistema y no se sabe de quién son cuando hay cuatro proyectos arriba.
name: tecvol

services:
  postgres:
    image: postgres:17
    container_name: tecvol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PUERTO:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sin esto, `docker compose up` devuelve el control apenas arranca el
    # proceso y una migración lanzada acto seguido le pega a una base que
    # todavía no acepta conexiones.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: tecvol-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PUERTO:-8081}:8080"
    environment:
      # Deja el campo «servidor» ya completo en la pantalla de acceso.
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
